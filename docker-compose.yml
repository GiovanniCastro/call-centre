# Servicios del perímetro para desarrollo local.
#
# **Las versiones son las mismas que las del CI, a propósito.** Un entorno local
# que corre PostgreSQL 15 y un CI que corre el 16 produce el fallo más caro de
# diagnosticar: el que solo pasa en un sitio. Si aquí se cambia una versión, se
# cambia también en .github/workflows/ci.yml, y al revés.
#
#   docker compose up -d      levantar
#   docker compose down       parar
#   docker compose down -v    parar y BORRAR los datos
#
# Los puertos son los de por omisión de cada servicio. Si ya tienes algo ocupando
# el 5432 o el 6379, cámbialos aquí y en tu .env — no en el CI.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perimetro
      POSTGRES_PASSWORD: perimetro
      POSTGRES_DB: perimetro
    ports:
      - '5432:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perimetro']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - datos_redis:/data
    # `appendonly` para que la cola sobreviva a un reinicio del contenedor. Sin
    # esto, «reiniciar el proceso no pierde la conversación» sería cierto del
    # proceso y falso del servicio, que es peor que ser falso del todo.
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - '6333:6333' # HTTP
      - '6334:6334' # gRPC
    volumes:
      - datos_qdrant:/qdrant/storage
    healthcheck:
      # La imagen de Qdrant no trae curl ni wget; se comprueba con bash sobre
      # /dev/tcp, que sí está.
      test: ['CMD-SHELL', 'bash -c ">/dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

# Volúmenes con nombre: los datos sobreviven a `docker compose down`. Para
# empezar de cero de verdad hace falta `down -v`, que es deliberadamente más
# difícil de escribir por accidente.
volumes:
  datos_postgres:
  datos_redis:
  datos_qdrant:
