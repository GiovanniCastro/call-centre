name: CI

# Los invariantes ⚙️ del canon, como comprobaciones que bloquean el merge.
# Ver docs/Propuesta-Desarrollo-Por-Fases.md §5.
#
# Un proyecto cuya tesis es «todo umbral tiene un vigía» no puede dejar sus
# propios umbrales de construcción a la buena voluntad. Estos son sus vigías.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Sin credenciales en el repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita el historial completo: un secreto que se añadió y
          # se borró en el commit siguiente sigue estando en el repositorio.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  invariantes:
    name: Tipos, lint, arquitectura y pruebas
    runs-on: ubuntu-latest

    # Redis de verdad, no un doble. Las pruebas del almacén corren dos veces —una
    # contra la implementación en memoria y otra contra esta— con el mismo cuerpo
    # de casos: si las dos no se comportan igual, cambiar de una a otra cambiaría
    # el comportamiento del sistema sin que nada avisara.
    #
    # Desde el 31-jul-2026 la máquina de desarrollo también los tiene, en las
    # mismas versiones (docker-compose.yml). Las versiones de los dos sitios se
    # cambian a la vez: un local con PostgreSQL 15 y un CI con el 16 produce el
    # fallo más caro de diagnosticar, el que solo pasa en un sitio.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # PostgreSQL, por el mismo motivo. «Reiniciar el proceso no pierde la
      # conversación en curso» no se puede probar con un doble: probaría que el
      # doble recuerda lo que le dijimos.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perimetro
          POSTGRES_PASSWORD: perimetro
          POSTGRES_DB: perimetro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Qdrant, desde la fase 2. Un doble probaría que el doble hace lo que le
      # dijimos; lo que hay que saber es que la colección se crea con las
      # dimensiones correctas, que guardar y buscar mantienen la correspondencia
      # entre vector y carga útil, y que el borrado por filtro alcanza justo los
      # fragmentos de un documento.
      #
      # La imagen no trae curl ni wget, así que la comprobación de salud va por
      # bash sobre /dev/tcp — igual que en docker-compose.yml.
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '>/dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://perimetro:perimetro@localhost:5432/perimetro
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Higiene: sin `any`. `tsc --strict` no prohíbe el `any` explícito —de eso
      # se encarga el lint— pero sí todo lo demás.
      - name: Tipos
        run: npm run check:tipos

      # Invariante 4 en el archivo, fuente única de costo, y sin `any`.
      - name: Lint
        run: npm run check:lint

      # Invariante 4 sobre el grafo completo: el camino de tres saltos que el
      # lint no ve. Más las fronteras de repos, Firebase y panel.
      - name: Arquitectura
        run: npm run check:arquitectura

      # Invariante 5: el arnés falla si una ruta emite cero eventos o dos.
      - name: Pruebas
        run: npm run test

      # El panel es TypeScript aparte, con su propio tsconfig. Sin este paso, un
      # error de tipos del panel solo aparecería al construirlo para desplegar.
      - name: Tipos del panel
        run: npm run check:panel

  # ── Las reglas de Firestore, contra el emulador ─────────────────────────────
  #
  # Job aparte, y no un paso más del anterior, por una razón práctica: el
  # emulador de Firestore corre sobre Java, y meterlo en el job de los
  # invariantes obligaría a instalar un JDK para ejecutar pruebas que no lo
  # necesitan. Aquí también se ve mejor qué falló: «las reglas» o «el perímetro».
  #
  # Los dos criterios que cierra son de la fase 6 y estuvieron abiertos hasta la
  # 8A: las reglas estaban escritas y razonadas, pero sin ejercitar. Una regla de
  # seguridad que nadie ha ejecutado es una creencia sobre cómo se comporta.
  reglas:
    name: Reglas de Firestore en el emulador
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # El emulador de Firestore es un binario de Java. Se fija la versión en vez
      # de confiar en la que traiga la imagen del ejecutor: el día que cambie, el
      # fallo aparecería aquí sin que nada de este repositorio se hubiera tocado.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # `--project demo-perimetro`: el prefijo `demo-` le dice a las herramientas
      # de Firebase que es un proyecto de emulador. No hace falta cuenta, ni
      # credencial, ni facturación — y por eso este check puede correr en cada PR
      # sin que nadie tenga que administrar un secreto.
      - name: Reglas
        run: npm run test:reglas
