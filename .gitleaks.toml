# Configuración de gitleaks — Perímetro
#
# Se **extiende** la configuración por omisión, no se sustituye: todo lo que
# gitleaks detecta de fábrica se sigue detectando. Este archivo solo añade
# exenciones, y cada una lleva su motivo escrito al lado.

[extend]
useDefault = true

# ── Las credenciales inventadas de la prueba de redacción ────────────────────
#
# `tests/secretos.test.ts` existe para demostrar que `redactar()` tapa lo que
# tiene forma de credencial. Para demostrarlo tiene que contener cosas con esa
# forma: una prueba de redacción sin nada que redactar no prueba nada. gitleaks
# acierta en la forma y se equivoca en el fondo.
#
# La exención es **por valor literal, no por archivo**. Se probó primero con
# `paths` más `regexes` y `condition = "AND"`, y se descartó al comprobarlo al
# revés: con la ruta en la exención, un secreto de verdad añadido a ese mismo
# archivo dejaba de detectarse. Eximir la ruta es eximir todo lo que caiga ahí
# dentro, hoy y en cualquier commit futuro — y un archivo que se llama
# «secretos» es el último sitio donde conviene apagar el escáner.
#
# Lo que queda eximido son estas dos cadenas y nada más. Cualquier otra cosa
# con forma de credencial —en este archivo o en otro— sigue rompiendo el check.
# Mismo criterio que R‑036: la exención viene con una comprobación más estricta
# que ella misma.
#
# Si estos literales cambian, el check vuelve a fallar y hay que actualizarlos
# aquí. Es deliberado: obliga a mirar qué cambió.
[[allowlists]]
description = "Credenciales inventadas de la prueba de redacción (fase 8A)"
regexes = [
  # El secreto de aplicación de WhatsApp que la prueba mete en el entorno para
  # comprobar la redacción por valor. Café muerto, literalmente.
  '''^c0ffee1234567890abcdef$''',
  # El cuerpo del PEM que comprueba la redacción por forma. No es una clave:
  # son cincuenta caracteres de base64 que no descifran nada. El literal lleva
  # los saltos de línea escritos como `\n`, así que el base64 va partido: se
  # busca el primer tramo, que es único en el repositorio.
  '''MIIEvQIBADANBgkqhkiG9w0BA''',
]
